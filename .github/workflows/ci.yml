name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contao53:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, gd, intl, mbstring, pdo_sqlite, xml, zip
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer update --with 'contao/core-bundle:5.3.*' --with 'contao/newsletter-bundle:5.3.*' --no-interaction --no-progress
      - run: composer test
      - run: find src contao tests -name '*.php' -print0 | xargs -0 -n1 php -l
